<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home · research · T1 One row of three</title>
<link rel="stylesheet" href="../research-2026-11-03/shared/base.css">
<link rel="stylesheet" href="../research-2026-11-03/shared/series.css">
<link rel="stylesheet" href="kit/home.css">
<link rel="stylesheet" href="kit/grid.css">
<style>
/* T1 · One row of three. A2 made thin (Arnel, 3 Nov: "it takes up too much space, something thinner"): the same night
   ground, hairline cards and series-colour accent, but one header line (eyebrow + 40px two-tone heading left; the four
   researchers as an avatar stack beside "See all research" right) and ONE row: the three newest papers, each a meta
   line, the finding as the title and a 132px chart. Column charts drop their y-axis (each column prints its figure). */
body { background: var(--night); }
.rs { padding: 72px 0 80px; }
@media (max-width: 1279px) { .rs { padding: 64px 0 72px; } }
@media (max-width: 899px) { .rs { padding: 56px 0 56px; } }

.th-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
.th-head .h2 { font-size: 40px; line-height: 1.04; letter-spacing: -.035em; margin-top: 12px; }
.th-side { display: flex; align-items: center; gap: 20px; flex-shrink: 0; padding-bottom: 4px; }

.stack { display: flex; }
.stack img { width: 32px; height: 32px; border-radius: 99px; object-fit: cover; box-shadow: 0 0 0 2px var(--night); }
.stack img + img { margin-left: -8px; }

.rs-grid { margin-top: 36px; gap: 24px; }
@media (min-width: 900px) and (max-width: 1099px) { .rs-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
.rc { padding: 26px 28px 24px; }
.rc-title { font-size: 20px; line-height: 1.25; margin-top: 16px; min-height: 50px; }
.rc-fig { margin-top: 22px; }
.rc .c2.is-sm .c2-top { margin-bottom: 14px; }
.rc .c2-under { margin-top: 14px; }

@media (max-width: 899px) {
  .th-head { flex-direction: column; align-items: flex-start; gap: 20px; }
  .th-head .h2 { font-size: 32px; }
  .th-side { padding-bottom: 0; }
  .rs-grid { margin-top: 28px; }
  .rc { flex: 0 0 min(84%, 330px); padding: 22px 20px 20px; }
  .rc-title { font-size: 19px; min-height: 72px; margin-top: 14px; }
  .rc-fig { margin-top: 18px; }
  .rs-foot { margin-top: 16px; }
}
</style>
</head>
<body>

<section data-paper-name="Home · research · T1 One row of three" class="rs is-night">
  <div class="wrap">
    <div class="th-head">
      <div>
        <p class="eyebrow">Research</p>
        <h2 class="h2">We measure it, <span class="soft">then we publish it</span></h2>
      </div>
      <div class="th-side">
        <div class="stack" aria-label="Researchers: Arnel Bukva, Tamara Pavlovic, Andrea Van Wyk, Abhay Tyagi">
          <img src="../research-2026-11-03/shared/img/arnel-bukva-v3.jpg" alt="" title="Arnel Bukva">
          <img src="../research-2026-11-03/shared/img/tamara-pavlovic-v3.jpg" alt="" title="Tamara Pavlovic">
          <img src="../research-2026-11-03/shared/img/andrea-van-wyk-v5.jpg" alt="" title="Andrea Van Wyk">
          <img src="../research-2026-11-03/shared/img/abhay-tyagi-v3.jpg" alt="" title="Abhay Tyagi">
        </div>
        <a class="rh-link" href="https://www.loudface.co/research">See all research <svg class="arr" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </div>
    </div>
    <div class="rs-grid" id="rs-grid"></div>
    <div class="rs-foot"><span>Swipe for the three newest papers</span><span class="rs-dots" id="rs-dots"></span></div>
  </div>
</section>

<script src="kit/research.js"></script>
<script src="kit/home.js"></script>
<script>
(function () {
  const { S, serOf, short, url } = RH;
  const IDS = ['cite-wait', 'seo-time', 'state-seo']; // the three newest papers (3 Nov, 25 Oct, 24 Oct 2026)
  const LIT = { index: '#a5a1ff', saas: '#f8936f', ai: '#86dcb4', meas: '#f3c565' };
  const h = matchMedia('(max-width: 899px)').matches ? 128 : 132;
  document.getElementById('rs-grid').innerHTML = IDS.map((id) => {
    const s = S(id), se = serOf(s);
    return `<a class="rc" href="${url(s)}">
      <div class="rc-meta"><span><i class="s-mark" style="background:${LIT[se.key]}"></i>${se.name}</span><span>${short(s.date)}</span></div>
      <h3 class="rc-title">${s.finding.replace(/\.$/, '')}</h3>
      <div class="rc-fig"><div class="rc-chart" data-chart2="${id}" data-size="sm" data-paint="off" data-caption="off" data-card="on" data-h="${h}" data-axis="off" data-ground="stage" data-tone="night" data-accent="${LIT[se.key]}" data-rest="#625f8f"></div></div>
    </a>`;
  }).join('');
  document.getElementById('rs-dots').innerHTML = IDS.map(() => '<i></i>').join('');
})();
</script>
<script src="kit/charts-v2-thin.js"></script>
<script src="../research-2026-11-03/shared/freeze-late.js"></script>
</body>
</html>
