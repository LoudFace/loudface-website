name: Typecheck

# Fast, secret-free TypeScript gate. Runs `tsc --noEmit` on every PR (including
# forks, which Vercel does not build a preview for) and on pushes to main.
# Catches the class of error that broke PR #13 — a type error fails `next build`
# on Vercel, but only after merge; this surfaces it on the PR instead.

on:
  pull_request:
  push:
    branches: [main]

# Newer push to the same branch/PR cancels the older run.
concurrency:
  group: typecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The inline editor's own tests: the sanitiser's attack corpus, and every
      # value in src/data/content checked against the ids and the writer. Pure
      # functions over files in the repo, so they need no secrets and no server.
      - name: Inline editor tests
        run: npm run test:editor

      # The five house rules of the editor that can be checked by reading the
      # repository: the bar behind a Draft Mode gate, getters through markTree,
      # metadata off the marked getters, no component transforming a content
      # value, and content keys the publish route accepts. The sixth rule —
      # no marker in what an anonymous visitor gets — needs the live site and
      # stays in the runbook.
      - name: Inline editor rules
        run: npm run check:editor
